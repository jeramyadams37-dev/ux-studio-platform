<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Studio Curriculum</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        class UXStudioState {
            constructor() {
                this.storageKey = 'uxc';
                this.defaultState = { name: '', lessons: {}, quizzes: {}, projects: {}, labs: {}, exams: {}, srsQueue: [] };
                this.data = this.load();
            }
            load() {
                try { return { ...this.defaultState, ...JSON.parse(localStorage.getItem(this.storageKey) || '{}') }; } 
                catch (e) { return this.defaultState; }
            }
            save() { 
                localStorage.setItem(this.storageKey, JSON.stringify(this.data)); 
                this.checkModuleCompletion();
            }
            
            updateProject(moduleId, stepIndex, isChecked) {
                if (!this.data.projects[moduleId]) this.data.projects[moduleId] = { steps: {}, evidence: '' };
                this.data.projects[moduleId].steps[stepIndex] = isChecked;
                this.save();
            }
            
            updateEvidence(moduleId, text) {
                if (!this.data.projects[moduleId]) this.data.projects[moduleId] = { steps: {}, evidence: '' };
                this.data.projects[moduleId].evidence = text;
                this.save();
            }

            scheduleReview(questionId, isCorrect) {
                let item = this.data.srsQueue.find(q => q.questionId === questionId);
                if (!item) {
                    item = { questionId, nextReviewDate: Date.now(), interval: 1, easeFactor: 2.5 };
                    this.data.srsQueue.push(item);
                }
                if (isCorrect) {
                    item.interval = item.interval === 1 ? 3 : Math.round(item.interval * item.easeFactor);
                    item.easeFactor = Math.max(1.3, item.easeFactor + 0.1);
                } else {
                    item.interval = 1;
                    item.easeFactor = Math.max(1.3, item.easeFactor - 0.2);
                }
                item.nextReviewDate = Date.now() + (item.interval * 24 * 60 * 60 * 1000);
                this.save();
            }

            completeLab(labId) {
                this.data.labs[labId] = true;
                this.save();
            }

            checkModuleCompletion() {
                let completeCount = 0;
                Object.keys(this.data.projects).forEach(mod => {
                    const p = this.data.projects[mod];
                    const q = this.data.quizzes[mod];
                    if (q?.passed && p?.evidence?.length >= 30) completeCount++;
                });
                const indicator = document.getElementById('progress-indicator');
                if(indicator) indicator.innerText = `Modules Mastered: ${completeCount} | Labs Completed: ${Object.keys(this.data.labs).length}`;
            }
        }
        const stateManager = new UXStudioState();

        // WCAG Contrast Math Utility
        function getLuminance(hex) {
            const rgb = parseInt(hex.slice(1), 16);
            const r = (rgb >> 16) & 0xff;
            const g = (rgb >>  8) & 0xff;
            const b = (rgb >>  0) & 0xff;
            const [rs, gs, bs] = [r, g, b].map(c => {
                c = c / 255;
                return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
        }
        function getContrastRatio(hex1, hex2) {
            const l1 = getLuminance(hex1);
            const l2 = getLuminance(hex2);
            return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased p-4 md:p-8">
    
    <nav class="max-w-4xl mx-auto flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <h1 class="font-bold text-xl text-indigo-600 tracking-tight">UX Studio</h1>
        <div id="progress-indicator" class="text-sm font-semibold text-gray-600 bg-gray-100 py-1 px-3 rounded-full">
            Loading State...
        </div>
    </nav>

    <main class="max-w-4xl mx-auto bg-white p-6 md:p-12 rounded-xl shadow-sm border border-gray-200 prose prose-indigo max-w-none">
        <div id="app-content">Loading curriculum...</div>
    </main>

    <script>
        function injectLabs() {
            // --- Lab 1: Contrast Lab ---
            const lab1Headers = Array.from(document.querySelectorAll('h3, h4, li, p')).filter(el => el.textContent.includes('1. **Contrast Lab**') || el.textContent.includes('1. Contrast Lab'));
            
            lab1Headers.forEach(header => {
                if(header.dataset.labInjected) return;
                
                const labContainer = document.createElement('div');
                labContainer.className = 'mt-6 p-6 bg-gray-50 rounded-xl border border-gray-200 not-prose';
                labContainer.innerHTML = `
                    <h4 class="text-lg font-bold text-gray-900 mb-2">Interactive Sandbox: Contrast Lab[span_4](start_span)[span_4](end_span)</h4>
                    <p class="text-sm text-gray-600 mb-6">Build a color pair that passes WCAG AA (>= 4.5:1). Avoid plain black on white[span_5](start_span)[span_5](end_span).</p>
                    
                    <div class="flex flex-col md:flex-row gap-6 mb-6">
                        <div class="flex-1 space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Text Color</label>
                                <div class="flex items-center space-x-2">
                                    <input type="color" id="lab1-text" value="#ffffff" class="h-10 w-10 rounded cursor-pointer border-0 p-0">
                                    <span id="lab1-text-hex" class="text-sm text-gray-500 font-mono uppercase">#FFFFFF</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Background Color</label>
                                <div class="flex items-center space-x-2">
                                    <input type="color" id="lab1-bg" value="#3f00ff" class="h-10 w-10 rounded cursor-pointer border-0 p-0">
                                    <span id="lab1-bg-hex" class="text-sm text-gray-500 font-mono uppercase">#3F00FF</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex-1 flex flex-col justify-center items-center p-6 rounded-lg shadow-inner text-center transition-colors duration-300" id="lab1-preview" style="background-color: #3f00ff; color: #ffffff;">
                            <span class="text-3xl font-bold mb-2">Aa</span>
                            <span class="text-sm font-medium">Normal Text Preview</span>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between p-4 bg-white rounded-lg shadow-sm border border-gray-100">
                        <div>
                            <span class="block text-xs text-gray-500 uppercase tracking-wide font-bold">Contrast Ratio</span>
                            <span id="lab1-ratio" class="text-2xl font-black text-gray-900">1.00:1</span>
                        </div>
                        <div id="lab1-status" class="px-4 py-2 rounded-full text-sm font-bold bg-gray-100 text-gray-500">
                            Testing...
                        </div>
                    </div>
                `;
                
                header.parentNode.insertBefore(labContainer, header.nextSibling);
                header.dataset.labInjected = 'true';

                const txtInput = document.getElementById('lab1-text');
                const bgInput = document.getElementById('lab1-bg');
                const txtHex = document.getElementById('lab1-text-hex');
                const bgHex = document.getElementById('lab1-bg-hex');
                const preview = document.getElementById('lab1-preview');
                const ratioDisplay = document.getElementById('lab1-ratio');
                const statusDisplay = document.getElementById('lab1-status');

                function updateLab1() {
                    const txt = txtInput.value;
                    const bg = bgInput.value;
                    txtHex.innerText = txt.toUpperCase();
                    bgHex.innerText = bg.toUpperCase();
                    preview.style.color = txt;
                    preview.style.backgroundColor = bg;
                    
                    const ratio = getContrastRatio(txt, bg);
                    ratioDisplay.innerText = `${ratio.toFixed(2)}:1`;

                    const isBlackWhite = (txt === '#ffffff' && bg === '#000000') || (txt === '#000000' && bg === '#ffffff');

                    if (ratio >= 4.5 && !isBlackWhite) {
                        statusDisplay.innerText = '✅ WCAG AA Passed';
                        statusDisplay.className = 'px-4 py-2 rounded-full text-sm font-bold bg-green-100 text-green-700';
                        stateManager.completeLab('contrast-lab');
                    } else if (isBlackWhite) {
                        statusDisplay.innerText = '❌ Too basic (Try colors)';
                        statusDisplay.className = 'px-4 py-2 rounded-full text-sm font-bold bg-yellow-100 text-yellow-700';
                    } else {
                        statusDisplay.innerText = '❌ Fail (Needs 4.5:1)';
                        statusDisplay.className = 'px-4 py-2 rounded-full text-sm font-bold bg-red-100 text-red-700';
                    }
                }
                txtInput.addEventListener('input', updateLab1);
                bgInput.addEventListener('input', updateLab1);
                updateLab1();
            });

            // --- Lab 2: Type Scale Lab ---
            const lab2Headers = Array.from(document.querySelectorAll('h3, h4, li, p')).filter(el => el.textContent.includes('2. **Type Scale Lab**') || el.textContent.includes('2. Type Scale Lab'));
            
            lab2Headers.forEach(header => {
                if(header.dataset.labInjected) return;

                const labContainer = document.createElement('div');
                labContainer.className = 'mt-6 p-6 bg-gray-50 rounded-xl border border-gray-200 not-prose';
                labContainer.innerHTML = `
                    <h4 class="text-lg font-bold text-gray-900 mb-2">Interactive Sandbox: Type Scale Lab[span_6](start_span)[span_6](end_span)</h4>
                    <p class="text-sm text-gray-600 mb-6">Design a readable modular type scale. Base size must be >= 16px to complete[span_7](start_span)[span_7](end_span).</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Base Size: <span id="lab2-base-val" class="font-bold text-indigo-600">16</span>px</label>
                                <input type="range" id="lab2-base" min="12" max="24" value="16" step="1" class="w-full accent-indigo-600">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Scale Ratio</label>
                                <select id="lab2-ratio" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="1.067">Minor Second (1.067)</option>
                                    <option value="1.125">Major Second (1.125)</option>
                                    <option value="1.200" selected>Minor Third (1.200)</option>
                                    <option value="1.250">Major Third (1.250)</option>
                                    <option value="1.333">Perfect Fourth (1.333)</option>
                                    <option value="1.414">Augmented Fourth (1.414)</option>
                                    <option value="1.500">Perfect Fifth (1.500)</option>
                                </select>
                            </div>
                            <button id="lab2-save" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md font-medium hover:bg-indigo-700 transition-colors shadow-sm">Save Scale Configuration</button>
                        </div>
                        
                        <div class="p-4 bg-white rounded-lg shadow-inner border border-gray-200 space-y-3 overflow-y-auto max-h-64" id="lab2-preview">
                            <!-- Dynamic Scale Preview Rendered Here -->
                        </div>
                    </div>

                    <div id="lab2-status" class="p-3 rounded-lg text-center font-bold text-sm bg-gray-100 text-gray-500">
                        Adjust scale and click Save to complete.
                    </div>
                `;

                header.parentNode.insertBefore(labContainer, header.nextSibling);
                header.dataset.labInjected = 'true';

                const baseInput = document.getElementById('lab2-base');
                const baseValSpan = document.getElementById('lab2-base-val');
                const ratioSelect = document.getElementById('lab2-ratio');
                const previewBox = document.getElementById('lab2-preview');
                const saveBtn = document.getElementById('lab2-save');
                const statusDiv = document.getElementById('lab2-status');

                function updateLab2() {
                    const base = parseFloat(baseInput.value);
                    const ratio = parseFloat(ratioSelect.value);
                    baseValSpan.innerText = base;

                    // Generate 5 steps of modular scale (Caption, Body, H3, H2, H1)
                    const steps = [
                        { name: 'Caption', size: Math.round(base / ratio) },
                        { name: 'Body', size: base },
                        { name: 'H3', size: Math.round(base * ratio) },
                        { name: 'H2', size: Math.round(base * Math.pow(ratio, 2)) },
                        { name: 'H1', size: Math.round(base * Math.pow(ratio, 3)) }
                    ];

                    previewBox.innerHTML = steps.map(s => `
                        <div class="flex items-baseline justify-between border-b border-gray-100 pb-1">
                            <span class="text-xs text-gray-400 font-mono">${s.name} (${s.size}px)</span>
                            <span style="font-size: ${s.size}px; line-height: 1.2;" class="font-bold text-gray-800">Preview Text</span>
                        </div>
                    `).join('');
                }

                baseInput.addEventListener('input', updateLab2);
                ratioSelect.addEventListener('change', updateLab2);

                saveBtn.addEventListener('click', () => {
                    const base = parseFloat(baseInput.value);
                    if (base >= 16) {
                        stateManager.completeLab('type-scale-lab');
                        statusDiv.innerText = '✅ Type Scale Saved & Lab Complete!';
                        statusDiv.className = 'p-3 rounded-lg text-center font-bold text-sm bg-green-100 text-green-700';
                    } else {
                        statusDiv.innerText = '❌ Base size must be at least 16px[span_8](start_span)[span_8](end_span).';
                        statusDiv.className = 'p-3 rounded-lg text-center font-bold text-sm bg-red-100 text-red-700';
                    }
                });

                updateLab2();
            });
        }

        function transformInteractiveElements() {
            let currentModule = 'intro';
            document.querySelectorAll('h3').forEach(h3 => {
                const text = h3.textContent;
                if(text.includes('Module')) {
                    currentModule = text.split(':')[0].replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                    h3.setAttribute('data-module', currentModule);
                }
            });

            document.querySelectorAll('h4').forEach(h4 => {
                const title = h4.textContent.trim();
                const container = h4.nextElementSibling;
                let moduleNode = h4;
                while (moduleNode && moduleNode.tagName !== 'H3') { moduleNode = moduleNode.previousElementSibling; }
                const moduleId = moduleNode ? moduleNode.getAttribute('data-module') : 'unknown';

                if (title === 'Project' || title.includes('Project:')) {
                    if (container && (container.tagName === 'OL' || container.tagName === 'UL')) {
                        const steps = container.querySelectorAll('li');
                        steps.forEach((li, index) => {
                            const originalText = li.innerHTML;
                            const isChecked = stateManager.data.projects[moduleId]?.steps[index] ? 'checked' : '';
                            li.innerHTML = `<label class="flex items-start space-x-3 cursor-pointer p-2 hover:bg-gray-50 rounded transition-colors"><input type="checkbox" class="mt-1 h-4 w-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500" data-module="${moduleId}" data-step="${index}" ${isChecked}><span class="text-gray-700">${originalText}</span></label>`;
                        });
                        
                        const existingEvidence = stateManager.data.projects[moduleId]?.evidence || '';
                        const evidenceBox = document.createElement('div');
                        evidenceBox.className = 'mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200';
                        evidenceBox.innerHTML = `
                            <label class="block text-sm font-medium text-gray-700 mb-2">Evidence Note (Required: 30+ chars)</label>
                            <textarea class="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" rows="3" placeholder="Paste a link to your Figma file, GitHub repo, or live project here..." data-module="${moduleId}">${existingEvidence}</textarea>
                            <p class="text-xs text-gray-500 mt-2 evidence-counter">Current length: <span class="${existingEvidence.length >= 30 ? 'text-green-600' : 'text-red-500'} font-bold">${existingEvidence.length}</span> chars</p>
                        `;
                        container.parentNode.insertBefore(evidenceBox, container.nextSibling);
                    }
                }

                if (title === 'Quiz' || title.includes('Quiz:')) {
                    if (container && (container.tagName === 'OL' || container.tagName === 'UL')) {
                        const quizForm = document.createElement('form');
                        quizForm.className = 'quiz-form mt-4 space-y-6';
                        quizForm.dataset.module = moduleId;
                        
                        const questions = container.querySelectorAll(':scope > li');
                        let questionHtml = '';
                        
                        questions.forEach((qLi, qIndex) => {
                            const questionText = qLi.childNodes[0].textContent.trim();
                            const questionId = `${moduleId}-q${qIndex}`;
                            const optionsUl = qLi.querySelector('ul');
                            if(!optionsUl) return;
                            
                            const options = optionsUl.querySelectorAll('li');
                            let optionsHtml = '';
                            let explanation = '';
                            
                            options.forEach((optLi, oIndex) => {
                                const optText = optLi.textContent.trim();
                                if (optText.startsWith('Why:')) {
                                    explanation = optText.replace('Why:', '').trim();
                                } else {
                                    const isCorrect = optText.includes('(correct)');
                                    const cleanOptText = optText.replace('(correct)', '').trim();
                                    optionsHtml += `
                                        <label class="flex items-center space-x-3 p-2 rounded hover:bg-gray-50 cursor-pointer border border-transparent transition-colors opt-label">
                                            <input type="radio" name="${questionId}" value="${oIndex}" data-correct="${isCorrect}" class="text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                                            <span class="text-gray-700">${cleanOptText}</span>
                                        </label>
                                    `;
                                }
                            });
                            
                            questionHtml += `
                                <div class="p-5 bg-white border border-gray-200 rounded-lg shadow-sm question-block transition-colors" data-qid="${questionId}">
                                    <p class="font-medium text-gray-900 mb-4">${qIndex + 1}. ${questionText}</p>
                                    <div class="space-y-2">${optionsHtml}</div>
                                    <div class="explanation hidden mt-4 p-3 bg-indigo-50 text-indigo-800 text-sm rounded-md border border-indigo-100">
                                        <span class="font-bold uppercase tracking-wide text-xs">Explanation:</span> ${explanation}
                                    </div>
                                </div>
                            `;
                        });
                        
                        quizForm.innerHTML = `
                            ${questionHtml}
                            <div class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                                <button type="button" class="submit-quiz w-full sm:w-auto bg-indigo-600 text-white px-6 py-2.5 rounded-md hover:bg-indigo-700 font-medium transition-colors shadow-sm">Submit Answers</button>
                                <span class="quiz-result font-bold text-lg"></span>
                            </div>
                        `;
                        container.parentNode.replaceChild(quizForm, container);
                    }
                }
            });

            document.querySelectorAll('input[type="checkbox"]').forEach(box => {
                box.addEventListener('change', e => stateManager.updateProject(e.target.dataset.module, e.target.dataset.step, e.target.checked));
            });
            document.querySelectorAll('textarea').forEach(area => {
                area.addEventListener('input', e => {
                    const text = e.target.value;
                    stateManager.updateEvidence(e.target.dataset.module, text);
                    const counterSpan = e.target.parentElement.querySelector('.evidence-counter span');
                    counterSpan.innerText = text.length;
                    counterSpan.className = text.length >= 30 ? 'text-green-600 font-bold' : 'text-red-500 font-bold';
                });
            });
            document.querySelectorAll('.submit-quiz').forEach(btn => {
                btn.addEventListener('click', e => {
                    const form = e.target.closest('form');
                    const moduleId = form.dataset.module;
                    const questions = form.querySelectorAll('.question-block');
                    let correctCount = 0;
                    const answers = {};
                    
                    questions.forEach(qBlock => {
                        const qid = qBlock.dataset.qid;
                        const selected = qBlock.querySelector(`input[name="${qid}"]:checked`);
                        const explanation = qBlock.querySelector('.explanation');
                        const labels = qBlock.querySelectorAll('.opt-label');
                        
                        labels.forEach(l => { l.classList.remove('bg-green-50', 'border-green-200', 'bg-red-50', 'border-red-200'); });
                        qBlock.classList.remove('border-green-400', 'border-red-400', 'border-gray-200');

                        let isCorrect = false;
                        if (selected) {
                            isCorrect = selected.dataset.correct === 'true';
                            answers[qid] = selected.value;
                            const parentLabel = selected.closest('.opt-label');
                            parentLabel.classList.add(isCorrect ? 'bg-green-50' : 'bg-red-50');
                            parentLabel.classList.add(isCorrect ? 'border-green-200' : 'border-red-200');
                        }
                        
                        if (isCorrect) correctCount++;
                        explanation.classList.remove('hidden');
                        qBlock.classList.add(isCorrect ? 'border-green-400' : 'border-red-400');
                        
                        stateManager.scheduleReview(qid, isCorrect);
                    });
                    
                    const total = questions.length;
                    const required = Math.round(0.8 * total);
                    const passed = correctCount >= required;
                    
                    stateManager.data.quizzes[moduleId] = { score: correctCount, total, passed, answers };
                    stateManager.save();
                    
                    const resultSpan = form.querySelector('.quiz-result');
                    resultSpan.innerText = `Score: ${correctCount}/${total} — ${passed ? '✅ Passed!' : '❌ Needs Review'}`;
                    resultSpan.className = `quiz-result font-bold text-lg ${passed ? 'text-green-600' : 'text-red-600'}`;
                });
            });

            stateManager.checkModuleCompletion();
        }

        fetch('ux-studio-curriculum.md')
            .then(response => response.text())
            .then(text => {
                document.getElementById('app-content').innerHTML = marked.parse(text);
                transformInteractiveElements();
                injectLabs();
            })
            .catch(err => {
                document.getElementById('app-content').innerHTML = '<p class="text-red-500">Error loading curriculum file.</p>';
            });
    </script>
</body>
</html>
