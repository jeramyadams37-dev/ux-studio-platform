<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Studio Curriculum</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        class UXStudioState {
            constructor() {
                this.storageKey = 'uxc';
                this.defaultState = { name: '', lessons: {}, quizzes: {}, projects: {}, labs: {}, exams: {}, srsQueue: [] };
                this.data = this.load();
            }
            load() {
                try { return { ...this.defaultState, ...JSON.parse(localStorage.getItem(this.storageKey) || '{}') }; } 
                catch (e) { return this.defaultState; }
            }
            save() { 
                localStorage.setItem(this.storageKey, JSON.stringify(this.data)); 
                this.checkModuleCompletion();
            }
            
            updateProject(moduleId, stepIndex, isChecked) {
                if (!this.data.projects[moduleId]) this.data.projects[moduleId] = { steps: {}, evidence: '' };
                this.data.projects[moduleId].steps[stepIndex] = isChecked;
                this.save();
            }
            
            updateEvidence(moduleId, text) {
                if (!this.data.projects[moduleId]) this.data.projects[moduleId] = { steps: {}, evidence: '' };
                this.data.projects[moduleId].evidence = text;
                this.save();
            }

            scheduleReview(questionId, isCorrect) {
                let item = this.data.srsQueue.find(q => q.questionId === questionId);
                if (!item) {
                    item = { questionId, nextReviewDate: Date.now(), interval: 1, easeFactor: 2.5 };
                    this.data.srsQueue.push(item);
                }
                if (isCorrect) {
                    item.interval = item.interval === 1 ? 3 : Math.round(item.interval * item.easeFactor);
                    item.easeFactor = Math.max(1.3, item.easeFactor + 0.1);
                } else {
                    item.interval = 1;
                    item.easeFactor = Math.max(1.3, item.easeFactor - 0.2);
                }
                item.nextReviewDate = Date.now() + (item.interval * 24 * 60 * 60 * 1000);
                this.save();
            }

            completeLab(labId) {
                this.data.labs[labId] = true;
                this.save();
            }

            checkModuleCompletion() {
                let completeCount = 0;
                Object.keys(this.data.projects).forEach(mod => {
                    const p = this.data.projects[mod];
                    const q = this.data.quizzes[mod];
                    if (q?.passed && p?.evidence?.length >= 30) completeCount++;
                });
                const indicator = document.getElementById('progress-indicator');
                if(indicator) indicator.innerText = `Modules Mastered: ${completeCount} | Labs Completed: ${Object.keys(this.data.labs).length}`;
            }
        }
        const stateManager = new UXStudioState();

        // WCAG Contrast Math Utility
        function getLuminance(hex) {
            const rgb = parseInt(hex.slice(1), 16);
            const r = (rgb >> 16) & 0xff;
            const g = (rgb >>  8) & 0xff;
            const b = (rgb >>  0) & 0xff;
            const [rs, gs, bs] = [r, g, b].map(c => {
                c = c / 255;
                return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
        }
        function getContrastRatio(hex1, hex2) {
            const l1 = getLuminance(hex1);
            const l2 = getLuminance(hex2);
            return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased p-4 md:p-8">
    
    <nav class="max-w-4xl mx-auto flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <h1 class="font-bold text-xl text-indigo-600 tracking-tight">UX Studio</h1>
        <div id="progress-indicator" class="text-sm font-semibold text-gray-600 bg-gray-100 py-1 px-3 rounded-full">
            Loading State...
        </div>
    </nav>

    <main class="max-w-4xl mx-auto bg-white p-6 md:p-12 rounded-xl shadow-sm border border-gray-200 prose prose-indigo max-w-none">
        <div id="app-content">Loading curriculum...</div>
    </main>

    <script>
        function injectLabs() {
            // --- Lab 1: Contrast Lab ---
            const lab1Headers = Array.from(document.querySelectorAll('h3, h4, li, p')).filter(el => el.textContent.includes('1. **Contrast Lab**') || el.textContent.includes('1. Contrast Lab'));
            
            lab1Headers.forEach(header => {
                if(header.dataset.labInjected) return;
                
                const labContainer = document.createElement('div');
                labContainer.className = 'mt-6 p-6 bg-gray-50 rounded-xl border border-gray-200 not-prose';
                labContainer.innerHTML = `
                    <h4 class="text-lg font-bold text-gray-900 mb-2">Interactive Sandbox: Contrast Lab[span_4](start_span)[span_4](end_span)</h4>
                    <p class="text-sm text-gray-600 mb-6">Build a color pair that passes WCAG AA (>= 4.5:1). Avoid plain black on white[span_5](start_span)[span_5](end_span).</p>
                    
                    <div class="flex flex-col md:flex-row gap-6 mb-6">
                        <div class="flex-1 space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Text Color</label>
                                <div class="flex items-center space-x-2">
                                    <input type="color" id="lab1-text" value="#ffffff" class="h-10 w-10 rounded cursor-pointer border-0 p-0">
                                    <span id="lab1-text-hex" class="text-sm text-gray-500 font-mono uppercase">#FFFFFF</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Background Color</label>
                                <div class="flex items-center space-x-2">
                                    <input type="color" id="lab1-bg" value="#3f00ff" class="h-10 w-10 rounded cursor-pointer border-0 p-0">
                                    <span id="lab1-bg-hex" class="text-sm text-gray-500 font-mono uppercase">#3F00FF</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex-1 flex flex-col justify-center items-center p-6 rounded-lg shadow-inner text-center transition-colors duration-300" id="lab1-preview" style="background-color: #3f00ff; color: #ffffff;">
                            <span class="text-3xl font-bold mb-2">Aa</span>
                            <span class="text-sm font-medium">Normal Text Preview</span>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between p-4 bg-white rounded-lg shadow-sm border border-gray-100">
                        <div>
                            <span class="block text-xs text-gray-500 uppercase tracking-wide font-bold">Contrast Ratio</span>
                            <span id="lab1-ratio" class="text-2xl font-black text-gray-900">1.00:1</span>
                        </div>
                        <div id="lab1-status" class="px-4 py-2 rounded-full text-sm font-bold bg-gray-100 text-gray-500">
                            Testing...
                        </div>
                    </div>
                `;
                
                header.parentNode.insertBefore(labContainer, header.nextSibling);
                header.dataset.labInjected = 'true';

                const txtInput = document.getElementById('lab1-text');
                const bgInput = document.getElementById('lab1-bg');
                const txtHex = document.getElementById('lab1-text-hex');
                const bgHex = document.getElementById('lab1-bg-hex');
                const preview = document.getElementById('lab1-preview');
                const ratioDisplay = document.getElementById('lab1-ratio');
                const statusDisplay = document.getElementById('lab1-status');

                function updateLab1() {
                    const txt = txtInput.value;
                    const bg = bgInput.value;
                    txtHex.innerText = txt.toUpperCase();
                    bgHex.innerText = bg.toUpperCase();
                    preview.style.color = txt;
                    preview.style.backgroundColor = bg;
                    
                    const ratio = getContrastRatio(txt, bg);
                    ratioDisplay.innerText = `${ratio.toFixed(2)}:1`;

                    const isBlackWhite = (txt === '#ffffff' && bg === '#000000') || (txt === '#000000' && bg === '#ffffff');

                    if (ratio >= 4.5 && !isBlackWhite) {
                        statusDisplay.innerText = '✅ WCAG AA Passed';
                        statusDisplay.className = 'px-4 py-2 rounded-full text-sm font-bold bg-green-100 text-green-700';
                        stateManager.completeLab('contrast-lab');
                    } else if (isBlackWhite) {
                        statusDisplay.innerText = '❌ Too basic (Try colors)';
                        statusDisplay.className = 'px-4 py-2 rounded-full text-sm font-bold bg-yellow-100 text-yellow-700';
                    } else {
                        statusDisplay.innerText = '❌ Fail (Needs 4.5:1)';
                        statusDisplay.className = 'px-4 py-2 rounded-full text-sm font-bold bg-red-100 text-red-700';
                    }
                }
                txtInput.addEventListener('input', updateLab1);
                bgInput.addEventListener('input', updateLab1);
                updateLab1();
            });

            
            
            
            
            
            
            // --- Lab 8: Fitts's Law Lab ---
            const lab8Headers = Array.from(document.querySelectorAll('h3, h4, li, p')).filter(el => el.textContent.includes('8. **Fitts') || el.textContent.includes('8. Fitts'));
            
            lab8Headers.forEach(header => {
                if(header.dataset.labInjected) return;

                const labContainer = document.createElement('div');
                labContainer.className = 'mt-6 p-6 bg-gray-50 rounded-xl border border-gray-200 not-prose';
                labContainer.innerHTML = `
                    <h4 class="text-lg font-bold text-gray-900 mb-2">Interactive Sandbox: Fitts's Law</h4>
                    <p class="text-sm text-gray-600 mb-6">Fitts's Law states that target size and distance dictate interaction speed. Tap the 'Start' button, then tap the red target as fast as you can. Complete both tests to validate the law.</p>
                    
                    <div class="flex flex-col md:flex-row gap-6 mb-6">
                        <div class="flex-1 flex flex-col justify-center gap-4">
                            <div class="p-4 bg-white border border-gray-200 rounded-lg shadow-sm">
                                <span class="block text-xs text-gray-500 uppercase font-bold mb-1">Test 1: Small & Far</span>
                                <span id="lab8-time1" class="text-xl font-black text-gray-900">-- ms</span>
                            </div>
                            <div class="p-4 bg-white border border-gray-200 rounded-lg shadow-sm">
                                <span class="block text-xs text-gray-500 uppercase font-bold mb-1">Test 2: Large & Close</span>
                                <span id="lab8-time2" class="text-xl font-black text-gray-900">-- ms</span>
                            </div>
                            <div id="lab8-insight" class="hidden p-3 bg-indigo-50 border border-indigo-100 rounded-md text-sm text-indigo-800 font-medium">
                                Insight: Large targets in the bottom 'thumb zone' are significantly faster to tap.
                            </div>
                        </div>
                        
                        <div class="flex-1 flex justify-center">
                            <div id="lab8-canvas" class="relative bg-gray-200 border-4 border-gray-800 rounded-[2rem] w-full max-w-[280px] h-[350px] overflow-hidden shadow-inner flex items-center justify-center">
                                <button id="lab8-start" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-full shadow-md active:bg-indigo-700 transition-colors">Start Test 1</button>
                                
                                <!-- Dynamic Target -->
                                <button id="lab8-target" class="absolute hidden bg-red-500 rounded-full shadow-md active:bg-red-600"></button>
                            </div>
                        </div>
                    </div>

                    <div id="lab8-status" class="p-3 rounded-lg text-center font-bold text-sm bg-gray-100 text-gray-500 transition-colors">
                        Tap 'Start Test 1' inside the phone screen to begin.
                    </div>
                `;

                header.parentNode.insertBefore(labContainer, header.nextSibling);
                header.dataset.labInjected = 'true';

                const startBtn = labContainer.querySelector('#lab8-start');
                const targetBtn = labContainer.querySelector('#lab8-target');
                const time1Display = labContainer.querySelector('#lab8-time1');
                const time2Display = labContainer.querySelector('#lab8-time2');
                const insightBox = labContainer.querySelector('#lab8-insight');
                const statusDiv = labContainer.querySelector('#lab8-status');

                let currentTest = 1;
                let startTime = 0;

                startBtn.addEventListener('click', () => {
                    startBtn.classList.add('hidden');
                    targetBtn.classList.remove('hidden');
                    
                    if (currentTest === 1) {
                        // Small target, top corner (Hard to reach)
                        targetBtn.style.width = '30px';
                        targetBtn.style.height = '30px';
                        targetBtn.style.top = '20px';
                        targetBtn.style.right = '20px';
                        targetBtn.style.bottom = 'auto';
                        targetBtn.style.left = 'auto';
                        targetBtn.style.borderRadius = '50%';
                        statusDiv.innerText = 'Quick! Tap the red target!';
                    } else if (currentTest === 2) {
                        // Large target, bottom full width (Thumb zone)
                        targetBtn.style.width = '90%';
                        targetBtn.style.height = '60px';
                        targetBtn.style.bottom = '20px';
                        targetBtn.style.left = '5%';
                        targetBtn.style.top = 'auto';
                        targetBtn.style.right = 'auto';
                        targetBtn.style.borderRadius = '12px';
                        statusDiv.innerText = 'Quick! Tap the red target!';
                    }

                    startTime = Date.now();
                });

                targetBtn.addEventListener('click', () => {
                    const reactionTime = Date.now() - startTime;
                    targetBtn.classList.add('hidden');

                    if (currentTest === 1) {
                        time1Display.innerText = reactionTime + ' ms';
                        currentTest = 2;
                        startBtn.innerText = 'Start Test 2';
                        startBtn.classList.remove('hidden');
                        statusDiv.innerText = 'Test 1 Complete. Tap Start Test 2 when ready.';
                    } else if (currentTest === 2) {
                        time2Display.innerText = reactionTime + ' ms';
                        insightBox.classList.remove('hidden');
                        
                        stateManager.completeLab('fitts-law-lab');
                        statusDiv.innerText = '✅ Fitts\'s Law Validated! Lab Complete.';
                        statusDiv.className = 'p-3 rounded-lg text-center font-bold text-sm bg-green-100 text-green-700 transition-colors';
                    }
                });
            });


            // --- Lab 7: Accessibility Simulator Lab ---
            const lab7Headers = Array.from(document.querySelectorAll('h3, h4, li, p')).filter(el => el.textContent.includes('7. **Accessibility Simulator') || el.textContent.includes('7. Accessibility Simulator'));
            
            lab7Headers.forEach(header => {
                if(header.dataset.labInjected) return;

                const labContainer = document.createElement('div');
                labContainer.className = 'mt-6 p-6 bg-gray-50 rounded-xl border border-gray-200 not-prose';
                labContainer.innerHTML = `
                    <h4 class="text-lg font-bold text-gray-900 mb-2">Interactive Sandbox: Accessibility Simulator</h4>
                    <p class="text-sm text-gray-600 mb-6">Never rely on color alone to convey meaning. Apply a vision filter, observe how the red/green buttons become indistinguishable, then apply the Accessible UI fix to pass.</p>
                    
                    <div class="flex flex-col md:flex-row gap-8 mb-6">
                        <div class="w-full md:w-1/2 space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Simulate Vision Impairment</label>
                                <select id="lab7-filter" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="none">Normal Vision</option>
                                    <option value="grayscale(100%)">Achromatopsia (Total Color Blindness)</option>
                                    <option value="contrast(60%) brightness(90%)">Low Contrast Vision</option>
                                    <option value="blur(3px)">Cataracts (Blur)</option>
                                </select>
                            </div>
                            
                            <div class="pt-4 border-t border-gray-200">
                                <label class="flex items-center space-x-3 cursor-pointer p-3 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">
                                    <input type="checkbox" id="lab7-fix" class="h-5 w-5 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500">
                                    <span class="text-sm font-bold text-gray-800">Apply Accessible UI Fix</span>
                                </label>
                                <p class="text-xs text-gray-500 mt-2 ml-1">Adds icons, underlines, and high-contrast blue/black instead of red/green.</p>
                            </div>
                        </div>
                        
                        <div class="w-full md:w-1/2 flex justify-center bg-gray-200 p-6 rounded-lg shadow-inner overflow-hidden">
                            <div id="lab7-preview" class="bg-white p-5 rounded-lg shadow-md w-full max-w-[280px] transition-all duration-300">
                                <h5 class="font-bold text-gray-900 mb-2">Confirm Delete</h5>
                                <p class="text-sm text-gray-600 mb-6">Are you sure you want to delete this project? This action cannot be undone.</p>
                                
                                <div class="flex gap-3">
                                    <button id="lab7-btn-cancel" class="flex-1 py-2 rounded text-sm font-bold text-white transition-colors" style="background-color: #ef4444;">
                                        <span class="lab7-icon hidden mr-1">✖</span>Cancel
                                    </button>
                                    <button id="lab7-btn-confirm" class="flex-1 py-2 rounded text-sm font-bold text-white transition-colors" style="background-color: #22c55e;">
                                        <span class="lab7-icon hidden mr-1">✔</span>Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="lab7-status" class="p-3 rounded-lg text-center font-bold text-sm bg-gray-100 text-gray-500 transition-colors">
                        Step 1: Apply a vision filter to see the flaw.
                    </div>
                `;

                header.parentNode.insertBefore(labContainer, header.nextSibling);
                header.dataset.labInjected = 'true';

                const filterSelect = labContainer.querySelector('#lab7-filter');
                const fixToggle = labContainer.querySelector('#lab7-fix');
                const preview = labContainer.querySelector('#lab7-preview');
                const btnCancel = labContainer.querySelector('#lab7-btn-cancel');
                const btnConfirm = labContainer.querySelector('#lab7-btn-confirm');
                const icons = labContainer.querySelectorAll('.lab7-icon');
                const statusDiv = labContainer.querySelector('#lab7-status');

                let hasTestedFilter = false;

                function updateLab7() {
                    const filter = filterSelect.value;
                    const isFixed = fixToggle.checked;
                    
                    // Apply CSS Filter
                    preview.style.filter = filter;

                    if (filter !== 'none') hasTestedFilter = true;

                    // Apply UI Fixes
                    if (isFixed) {
                        btnCancel.style.backgroundColor = '#ffffff';
                        btnCancel.style.color = '#1f2937';
                        btnCancel.style.border = '2px solid #d1d5db';
                        
                        btnConfirm.style.backgroundColor = '#1d4ed8'; // High contrast blue
                        btnConfirm.style.border = '2px solid #1d4ed8';
                        
                        icons.forEach(i => i.classList.remove('hidden'));
                    } else {
                        btnCancel.style.backgroundColor = '#ef4444'; // Red
                        btnCancel.style.color = '#ffffff';
                        btnCancel.style.border = 'none';
                        
                        btnConfirm.style.backgroundColor = '#22c55e'; // Green
                        btnConfirm.style.border = 'none';
                        
                        icons.forEach(i => i.classList.add('hidden'));
                    }

                    // Completion Logic
                    if (hasTestedFilter && isFixed) {
                        stateManager.completeLab('accessibility-lab');
                        statusDiv.innerText = '✅ Lab Complete! Icons & contrast survive the filters.';
                        statusDiv.className = 'p-3 rounded-lg text-center font-bold text-sm bg-green-100 text-green-700 transition-colors';
                    } else if (hasTestedFilter && !isFixed) {
                        statusDiv.innerText = 'Step 2: Now check the "Apply Accessible UI Fix" box.';
                        statusDiv.className = 'p-3 rounded-lg text-center font-bold text-sm bg-yellow-100 text-yellow-700 transition-colors';
                    } else {
                        statusDiv.innerText = 'Step 1: Apply a vision filter to see the flaw.';
                        statusDiv.className = 'p-3 rounded-lg text-center font-bold text-sm bg-gray-100 text-gray-500 transition-colors';
                    }
                }

                filterSelect.addEventListener('change', updateLab7);
                fixToggle.addEventListener('change', updateLab7);
            });


            // --- Lab 6: Prototype Timing Lab ---
            const lab6Headers = Array.from(document.querySelectorAll('h3, h4, li, p')).filter(el => el.textContent.includes('6. **Prototype Timing') || el.textContent.includes('6. Prototype Timing'));
            
            lab6Headers.forEach(header => {
                if(header.dataset.labInjected) return;

                const labContainer = document.createElement('div');
                labContainer.className = 'mt-6 p-6 bg-gray-50 rounded-xl border border-gray-200 not-prose';
                labContainer.innerHTML = `
                    <h4 class="text-lg font-bold text-gray-900 mb-2">Interactive Sandbox: Prototype Timing Lab</h4>
                    <p class="text-sm text-gray-600 mb-6">Test micro-interaction timings. Complete the lab by setting the standard accessible UX timing (Ease-Out, 200ms - 300ms).</p>
                    
                    <div class="flex flex-col md:flex-row gap-8 mb-6 items-center">
                        <div class="w-full md:w-1/2 space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Easing Curve</label>
                                <select id="lab6-easing" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="linear">Linear</option>
                                    <option value="ease-in">Ease-In (Accelerate)</option>
                                    <option value="ease-out">Ease-Out (Decelerate)</option>
                                    <option value="ease-in-out">Ease-In-Out (Standard)</option>
                                    <option value="cubic-bezier(0.175, 0.885, 0.32, 1.275)">Spring (Bouncy)</option>
                                </select>
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="block text-sm font-medium text-gray-700">Duration: <span id="lab6-dur-val" class="font-bold text-indigo-600">500</span>ms</label>
                                </div>
                                <input type="range" id="lab6-duration" min="100" max="1000" value="500" step="50" class="w-full accent-indigo-600">
                            </div>
                            <button id="lab6-trigger" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md font-medium hover:bg-indigo-700 transition-colors shadow-sm">Play Animation</button>
                        </div>
                        
                        <div class="w-full md:w-1/2 flex flex-col justify-center bg-gray-200 p-6 rounded-lg shadow-inner h-48 relative overflow-hidden border border-gray-300">
                            <div class="absolute w-full px-6 left-0 flex items-center">
                                <div id="lab6-dot" class="h-12 w-12 bg-indigo-500 rounded-full shadow-lg transform transition-transform" style="transform: translateX(0px);"></div>
                            </div>
                        </div>
                    </div>

                    <div id="lab6-status" class="p-3 rounded-lg text-center font-bold text-sm bg-gray-100 text-gray-500 transition-colors">
                        Select Ease-Out and 200-300ms, then hit Play.
                    </div>
                `;

                header.parentNode.insertBefore(labContainer, header.nextSibling);
                header.dataset.labInjected = 'true';

                const easingSelect = labContainer.querySelector('#lab6-easing');
                const durSlider = labContainer.querySelector('#lab6-duration');
                const durVal = labContainer.querySelector('#lab6-dur-val');
                const triggerBtn = labContainer.querySelector('#lab6-trigger');
                const dot = labContainer.querySelector('#lab6-dot');
                const statusDiv = labContainer.querySelector('#lab6-status');

                let isToggled = false;

                function updateLab6Settings() {
                    durVal.innerText = durSlider.value;
                }

                easingSelect.addEventListener('change', updateLab6Settings);
                durSlider.addEventListener('input', updateLab6Settings);

                triggerBtn.addEventListener('click', () => {
                    const easing = easingSelect.value;
                    const duration = parseInt(durSlider.value);
                    
                    // Apply dynamic CSS transition properties securely
                    dot.style.transition = 'transform ' + duration + 'ms ' + easing;
                    
                    // Toggle position visually inside the bounding box
                    isToggled = !isToggled;
                    dot.style.transform = isToggled ? 'translateX(150px)' : 'translateX(0px)';

                    // Evaluate completion logic per curriculum specs
                    const isValidEasing = easing === 'ease-out';
                    const isValidDuration = duration >= 200 && duration <= 300;

                    if (isValidEasing && isValidDuration) {
                        stateManager.completeLab('prototype-timing-lab');
                        statusDiv.innerText = '✅ Perfect! Ease-Out at ~250ms is the UX standard.';
                        statusDiv.className = 'p-3 rounded-lg text-center font-bold text-sm bg-green-100 text-green-700 transition-colors';
                    } else if (isValidEasing) {
                        statusDiv.innerText = '❌ Easing is correct, but duration should be 200-300ms.';
                        statusDiv.className = 'p-3 rounded-lg text-center font-bold text-sm bg-yellow-100 text-yellow-700 transition-colors';
                    } else if (isValidDuration) {
                        statusDiv.innerText = '❌ Duration is good, but use Ease-Out for UI entrances.';
                        statusDiv.className = 'p-3 rounded-lg text-center font-bold text-sm bg-yellow-100 text-yellow-700 transition-colors';
                    } else {
                        statusDiv.innerText = '❌ Set easing to Ease-Out and duration to 200-300ms.';

                            const originalText = li.innerHTML;
                            const isChecked = stateManager.data.projects[moduleId]?.steps[index] ? 'checked' : '';
                            li.innerHTML = `<label class="flex items-start space-x-3 cursor-pointer p-2 hover:bg-gray-50 rounded transition-colors"><input type="checkbox" class="mt-1 h-4 w-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500" data-module="${moduleId}" data-step="${index}" ${isChecked}><span class="text-gray-700">${originalText}</span></label>`;
                        });
                        
                        const existingEvidence = stateManager.data.projects[moduleId]?.evidence || '';
                        const evidenceBox = document.createElement('div');
                        evidenceBox.className = 'mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200';
                        evidenceBox.innerHTML = `
                            <label class="block text-sm font-medium text-gray-700 mb-2">Evidence Note (Required: 30+ chars)</label>
                            <textarea class="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" rows="3" placeholder="Paste a link to your Figma file, GitHub repo, or live project here..." data-module="${moduleId}">${existingEvidence}</textarea>
                            <p class="text-xs text-gray-500 mt-2 evidence-counter">Current length: <span class="${existingEvidence.length >= 30 ? 'text-green-600' : 'text-red-500'} font-bold">${existingEvidence.length}</span> chars</p>
                        `;
                        container.parentNode.insertBefore(evidenceBox, container.nextSibling);
                    }
                }

                if (title === 'Quiz' || title.includes('Quiz:')) {
                    if (container && (container.tagName === 'OL' || container.tagName === 'UL')) {
                        const quizForm = document.createElement('form');
                        quizForm.className = 'quiz-form mt-4 space-y-6';
                        quizForm.dataset.module = moduleId;
                        
                        const questions = container.querySelectorAll(':scope > li');
                        let questionHtml = '';
                        
                        questions.forEach((qLi, qIndex) => {
                            const questionText = qLi.childNodes[0].textContent.trim();
                            const questionId = `${moduleId}-q${qIndex}`;
                            const optionsUl = qLi.querySelector('ul');
                            if(!optionsUl) return;
                            
                            const options = optionsUl.querySelectorAll('li');
                            let optionsHtml = '';
                            let explanation = '';
                            
                            options.forEach((optLi, oIndex) => {
                                const optText = optLi.textContent.trim();
                                if (optText.startsWith('Why:')) {
                                    explanation = optText.replace('Why:', '').trim();
                                } else {
                                    const isCorrect = optText.includes('(correct)');
                                    const cleanOptText = optText.replace('(correct)', '').trim();
                                    optionsHtml += `
                                        <label class="flex items-center space-x-3 p-2 rounded hover:bg-gray-50 cursor-pointer border border-transparent transition-colors opt-label">
                                            <input type="radio" name="${questionId}" value="${oIndex}" data-correct="${isCorrect}" class="text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                                            <span class="text-gray-700">${cleanOptText}</span>
                                        </label>
                                    `;
                                }
                            });
                            
                            questionHtml += `
                                <div class="p-5 bg-white border border-gray-200 rounded-lg shadow-sm question-block transition-colors" data-qid="${questionId}">
                                    <p class="font-medium text-gray-900 mb-4">${qIndex + 1}. ${questionText}</p>
                                    <div class="space-y-2">${optionsHtml}</div>
                                    <div class="explanation hidden mt-4 p-3 bg-indigo-50 text-indigo-800 text-sm rounded-md border border-indigo-100">
                                        <span class="font-bold uppercase tracking-wide text-xs">Explanation:</span> ${explanation}
                                    </div>
                                </div>
                            `;
                        });
                        
                        quizForm.innerHTML = `
                            ${questionHtml}
                            <div class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                                <button type="button" class="submit-quiz w-full sm:w-auto bg-indigo-600 text-white px-6 py-2.5 rounded-md hover:bg-indigo-700 font-medium transition-colors shadow-sm">Submit Answers</button>
                                <span class="quiz-result font-bold text-lg"></span>
                            </div>
                        `;
                        container.parentNode.replaceChild(quizForm, container);
                    }
                }
            });

            document.querySelectorAll('input[type="checkbox"]').forEach(box => {
                box.addEventListener('change', e => stateManager.updateProject(e.target.dataset.module, e.target.dataset.step, e.target.checked));
            });
            document.querySelectorAll('textarea').forEach(area => {
                area.addEventListener('input', e => {
                    const text = e.target.value;
                    stateManager.updateEvidence(e.target.dataset.module, text);
                    const counterSpan = e.target.parentElement.querySelector('.evidence-counter span');
                    counterSpan.innerText = text.length;
                    counterSpan.className = text.length >= 30 ? 'text-green-600 font-bold' : 'text-red-500 font-bold';
                });
            });
            document.querySelectorAll('.submit-quiz').forEach(btn => {
                btn.addEventListener('click', e => {
                    const form = e.target.closest('form');
                    const moduleId = form.dataset.module;
                    const questions = form.querySelectorAll('.question-block');
                    let correctCount = 0;
                    const answers = {};
                    
                    questions.forEach(qBlock => {
                        const qid = qBlock.dataset.qid;
                        const selected = qBlock.querySelector(`input[name="${qid}"]:checked`);
                        const explanation = qBlock.querySelector('.explanation');
                        const labels = qBlock.querySelectorAll('.opt-label');
                        
                        labels.forEach(l => { l.classList.remove('bg-green-50', 'border-green-200', 'bg-red-50', 'border-red-200'); });
                        qBlock.classList.remove('border-green-400', 'border-red-400', 'border-gray-200');

                        let isCorrect = false;
                        if (selected) {
                            isCorrect = selected.dataset.correct === 'true';
                            answers[qid] = selected.value;
                            const parentLabel = selected.closest('.opt-label');
                            parentLabel.classList.add(isCorrect ? 'bg-green-50' : 'bg-red-50');
                            parentLabel.classList.add(isCorrect ? 'border-green-200' : 'border-red-200');
                        }
                        
                        if (isCorrect) correctCount++;
                        explanation.classList.remove('hidden');
                        qBlock.classList.add(isCorrect ? 'border-green-400' : 'border-red-400');
                        
                        stateManager.scheduleReview(qid, isCorrect);
                    });
                    
                    const total = questions.length;
                    const required = Math.round(0.8 * total);
                    const passed = correctCount >= required;
                    
                    stateManager.data.quizzes[moduleId] = { score: correctCount, total, passed, answers };
                    stateManager.save();
                    
                    const resultSpan = form.querySelector('.quiz-result');
                    resultSpan.innerText = `Score: ${correctCount}/${total} — ${passed ? '✅ Passed!' : '❌ Needs Review'}`;
                    resultSpan.className = `quiz-result font-bold text-lg ${passed ? 'text-green-600' : 'text-red-600'}`;
                });
            });

            stateManager.checkModuleCompletion();
        }

        fetch('ux-studio-curriculum.md')
            .then(response => response.text())
            .then(text => {
                document.getElementById('app-content').innerHTML = marked.parse(text);
                transformInteractiveElements();
                injectLabs();
            })
            .catch(err => {
                document.getElementById('app-content').innerHTML = '<p class="text-red-500">Error loading curriculum file.</p>';
            });
    </script>
</body>
</html>
