<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Studio Curriculum</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // State Management Architecture
        class UXStudioState {
            constructor() {
                this.storageKey = 'uxc';
                this.defaultState = {
                    name: '',
                    lessons: {}, // { moduleId: boolean }
                    quizzes: {}, // { moduleId: { score: number, passed: boolean, answers: object } }
                    projects: {}, // { moduleId: { steps: object, evidence: string, complete: boolean } }
                    labs: {}, // { labId: boolean }
                    exams: {}, // { tier: score }
                    srsQueue: [] // [{ questionId: string, nextReviewDate: timestamp, interval: number, easeFactor: number }]
                };
                this.data = this.load();
            }

            load() {
                try {
                    const stored = localStorage.getItem(this.storageKey);
                    return stored ? { ...this.defaultState, ...JSON.parse(stored) } : this.defaultState;
                } catch (e) {
                    console.error("Storage access failed", e);
                    return this.defaultState;
                }
            }

            save() {
                localStorage.setItem(this.storageKey, JSON.stringify(this.data));
                this.checkModuleCompletion();
            }

            // SRS Logic (SuperMemo-2 inspired baseline)
            scheduleReview(questionId, isCorrect) {
                let item = this.data.srsQueue.find(q => q.questionId === questionId);
                if (!item) {
                    item = { questionId, nextReviewDate: Date.now(), interval: 1, easeFactor: 2.5 };
                    this.data.srsQueue.push(item);
                }

                if (isCorrect) {
                    item.interval = item.interval === 1 ? 3 : Math.round(item.interval * item.easeFactor);
                    item.easeFactor = Math.max(1.3, item.easeFactor + 0.1);
                } else {
                    item.interval = 1;
                    item.easeFactor = Math.max(1.3, item.easeFactor - 0.2);
                }
                
                // Set next review date based on interval (in days)
                item.nextReviewDate = Date.now() + (item.interval * 24 * 60 * 60 * 1000);
                this.save();
            }

            // Certification Rules Evaluation
            checkModuleCompletion(moduleId) {
                if (!moduleId) return;
                
                const lessonComplete = this.data.lessons[moduleId];
                const quizPassed = this.data.quizzes[moduleId]?.passed;
                
                const project = this.data.projects[moduleId];
                const projectComplete = project && 
                                      Object.values(project.steps || {}).every(v => v === true) && 
                                      (project.evidence || '').length >= 30;

                if (lessonComplete && quizPassed && projectComplete) {
                    console.log(`Module ${moduleId} fully complete!`);
                    // Trigger UI unlock for tiers here
                }
            }
        }

        const stateManager = new UXStudioState();
    </script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased p-4 md:p-8">
    
    <nav class="max-w-4xl mx-auto flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
        <h1 class="font-bold text-xl text-indigo-600">UX Studio</h1>
        <div id="progress-indicator" class="text-sm font-medium text-gray-500">
            Initializing State...
        </div>
    </nav>

    <main class="max-w-4xl mx-auto bg-white p-6 md:p-12 rounded-xl shadow-sm prose prose-indigo max-w-none">
        <div id="app-content">Loading curriculum...</div>
    </main>

    <script>
        // Update UI based on loaded state
        document.getElementById('progress-indicator').innerText = 
            `Modules Saved: ${Object.keys(stateManager.data.lessons).length}`;

        // Fetch and parse Markdown
        fetch('ux-studio-curriculum.md')
            .then(response => response.text())
            .then(text => {
                // Future patch: Custom marked.js renderer to convert lists under "Quiz" and "Project" headers into interactive HTML forms
                document.getElementById('app-content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('app-content').innerHTML = '<p class="text-red-500">Error loading curriculum file.</p>';
            });
    </script>
</body>
</html>
