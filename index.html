<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Studio Curriculum</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        class UXStudioState {
            constructor() {
                this.storageKey = 'uxc';
                this.defaultState = { name: '', lessons: {}, quizzes: {}, projects: {}, labs: {}, exams: {}, srsQueue: [] };
                this.data = this.load();
            }
            load() {
                try { return { ...this.defaultState, ...JSON.parse(localStorage.getItem(this.storageKey) || '{}') }; } 
                catch (e) { return this.defaultState; }
            }
            save() { 
                localStorage.setItem(this.storageKey, JSON.stringify(this.data)); 
                this.checkModuleCompletion();
            }
            
            updateProject(moduleId, stepIndex, isChecked) {
                if (!this.data.projects[moduleId]) this.data.projects[moduleId] = { steps: {}, evidence: '' };
                this.data.projects[moduleId].steps[stepIndex] = isChecked;
                this.save();
            }
            
            updateEvidence(moduleId, text) {
                if (!this.data.projects[moduleId]) this.data.projects[moduleId] = { steps: {}, evidence: '' };
                this.data.projects[moduleId].evidence = text;
                this.save();
            }

            scheduleReview(questionId, isCorrect) {
                let item = this.data.srsQueue.find(q => q.questionId === questionId);
                if (!item) {
                    item = { questionId, nextReviewDate: Date.now(), interval: 1, easeFactor: 2.5 };
                    this.data.srsQueue.push(item);
                }
                if (isCorrect) {
                    item.interval = item.interval === 1 ? 3 : Math.round(item.interval * item.easeFactor);
                    item.easeFactor = Math.max(1.3, item.easeFactor + 0.1);
                } else {
                    item.interval = 1;
                    item.easeFactor = Math.max(1.3, item.easeFactor - 0.2);
                }
                item.nextReviewDate = Date.now() + (item.interval * 24 * 60 * 60 * 1000);
                this.save();
            }

            checkModuleCompletion() {
                // Future expansion: Lock/Unlock exams based on module status
                let completeCount = 0;
                Object.keys(this.data.projects).forEach(mod => {
                    const p = this.data.projects[mod];
                    const q = this.data.quizzes[mod];
                    if (q?.passed && p?.evidence?.length >= 30) completeCount++;
                });
                const indicator = document.getElementById('progress-indicator');
                if(indicator) indicator.innerText = `Modules Mastered: ${completeCount}`;
            }
        }
        const stateManager = new UXStudioState();
    </script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased p-4 md:p-8">
    
    <nav class="max-w-4xl mx-auto flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <h1 class="font-bold text-xl text-indigo-600 tracking-tight">UX Studio</h1>
        <div id="progress-indicator" class="text-sm font-semibold text-gray-600 bg-gray-100 py-1 px-3 rounded-full">
            Loading State...
        </div>
    </nav>

    <main class="max-w-4xl mx-auto bg-white p-6 md:p-12 rounded-xl shadow-sm border border-gray-200 prose prose-indigo max-w-none">
        <div id="app-content">Loading curriculum...</div>
    </main>

    <script>
        function transformInteractiveElements() {
            let currentModule = 'intro';
            
            document.querySelectorAll('h3').forEach(h3 => {
                const text = h3.textContent;
                if(text.includes('Module')) {
                    currentModule = text.split(':')[0].replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                    h3.setAttribute('data-module', currentModule);
                }
            });

            document.querySelectorAll('h4').forEach(h4 => {
                const title = h4.textContent.trim();
                const container = h4.nextElementSibling;
                
                let moduleNode = h4;
                while (moduleNode && moduleNode.tagName !== 'H3') { moduleNode = moduleNode.previousElementSibling; }
                const moduleId = moduleNode ? moduleNode.getAttribute('data-module') : 'unknown';

                // --- Project Checklists ---
                if (title === 'Project' || title.includes('Project:')) {
                    if (container && (container.tagName === 'OL' || container.tagName === 'UL')) {
                        const steps = container.querySelectorAll('li');
                        steps.forEach((li, index) => {
                            const originalText = li.innerHTML;
                            const isChecked = stateManager.data.projects[moduleId]?.steps[index] ? 'checked' : '';
                            li.innerHTML = `<label class="flex items-start space-x-3 cursor-pointer p-2 hover:bg-gray-50 rounded transition-colors"><input type="checkbox" class="mt-1 h-4 w-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500" data-module="${moduleId}" data-step="${index}" ${isChecked}><span class="text-gray-700">${originalText}</span></label>`;
                        });
                        
                        const existingEvidence = stateManager.data.projects[moduleId]?.evidence || '';
                        const evidenceBox = document.createElement('div');
                        evidenceBox.className = 'mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200';
                        evidenceBox.innerHTML = `
                            <label class="block text-sm font-medium text-gray-700 mb-2">Evidence Note (Required: 30+ chars)</label>
                            <textarea class="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" rows="3" placeholder="Paste a link to your Figma file, GitHub repo, or live project here..." data-module="${moduleId}">${existingEvidence}</textarea>
                            <p class="text-xs text-gray-500 mt-2 evidence-counter">Current length: <span class="${existingEvidence.length >= 30 ? 'text-green-600' : 'text-red-500'} font-bold">${existingEvidence.length}</span> chars</p>
                        `;
                        container.parentNode.insertBefore(evidenceBox, container.nextSibling);
                    }
                }

                // --- Quiz Engine ---
                if (title === 'Quiz' || title.includes('Quiz:')) {
                    if (container && (container.tagName === 'OL' || container.tagName === 'UL')) {
                        const quizForm = document.createElement('form');
                        quizForm.className = 'quiz-form mt-4 space-y-6';
                        quizForm.dataset.module = moduleId;
                        
                        const questions = container.querySelectorAll(':scope > li');
                        let questionHtml = '';
                        
                        questions.forEach((qLi, qIndex) => {
                            // First child node is the text of the question itself
                            const questionText = qLi.childNodes[0].textContent.trim();
                            const questionId = `${moduleId}-q${qIndex}`;
                            const optionsUl = qLi.querySelector('ul');
                            if(!optionsUl) return;
                            
                            const options = optionsUl.querySelectorAll('li');
                            let optionsHtml = '';
                            let explanation = '';
                            
                            options.forEach((optLi, oIndex) => {
                                const optText = optLi.textContent.trim();
                                if (optText.startsWith('Why:')) {
                                    explanation = optText.replace('Why:', '').trim();
                                } else {
                                    const isCorrect = optText.includes('(correct)');
                                    const cleanOptText = optText.replace('(correct)', '').trim();
                                    optionsHtml += `
                                        <label class="flex items-center space-x-3 p-2 rounded hover:bg-gray-50 cursor-pointer border border-transparent transition-colors opt-label">
                                            <input type="radio" name="${questionId}" value="${oIndex}" data-correct="${isCorrect}" class="text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                                            <span class="text-gray-700">${cleanOptText}</span>
                                        </label>
                                    `;
                                }
                            });
                            
                            questionHtml += `
                                <div class="p-5 bg-white border border-gray-200 rounded-lg shadow-sm question-block transition-colors" data-qid="${questionId}">
                                    <p class="font-medium text-gray-900 mb-4">${qIndex + 1}. ${questionText}</p>
                                    <div class="space-y-2">${optionsHtml}</div>
                                    <div class="explanation hidden mt-4 p-3 bg-indigo-50 text-indigo-800 text-sm rounded-md border border-indigo-100">
                                        <span class="font-bold uppercase tracking-wide text-xs">Explanation:</span> ${explanation}
                                    </div>
                                </div>
                            `;
                        });
                        
                        quizForm.innerHTML = `
                            ${questionHtml}
                            <div class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                                <button type="button" class="submit-quiz w-full sm:w-auto bg-indigo-600 text-white px-6 py-2.5 rounded-md hover:bg-indigo-700 font-medium transition-colors shadow-sm">Submit Answers</button>
                                <span class="quiz-result font-bold text-lg"></span>
                            </div>
                        `;
                        container.parentNode.replaceChild(quizForm, container);
                    }
                }
            });

            // Project Listeners
            document.querySelectorAll('input[type="checkbox"]').forEach(box => {
                box.addEventListener('change', e => stateManager.updateProject(e.target.dataset.module, e.target.dataset.step, e.target.checked));
            });
            document.querySelectorAll('textarea').forEach(area => {
                area.addEventListener('input', e => {
                    const text = e.target.value;
                    stateManager.updateEvidence(e.target.dataset.module, text);
                    const counterSpan = e.target.parentElement.querySelector('.evidence-counter span');
                    counterSpan.innerText = text.length;
                    counterSpan.className = text.length >= 30 ? 'text-green-600 font-bold' : 'text-red-500 font-bold';
                });
            });

            // Quiz Listeners
            document.querySelectorAll('.submit-quiz').forEach(btn => {
                btn.addEventListener('click', e => {
                    const form = e.target.closest('form');
                    const moduleId = form.dataset.module;
                    const questions = form.querySelectorAll('.question-block');
                    let correctCount = 0;
                    const answers = {};
                    
                    questions.forEach(qBlock => {
                        const qid = qBlock.dataset.qid;
                        const selected = qBlock.querySelector(`input[name="${qid}"]:checked`);
                        const explanation = qBlock.querySelector('.explanation');
                        const labels = qBlock.querySelectorAll('.opt-label');
                        
                        // Reset styles
                        labels.forEach(l => { l.classList.remove('bg-green-50', 'border-green-200', 'bg-red-50', 'border-red-200'); });
                        qBlock.classList.remove('border-green-400', 'border-red-400', 'border-gray-200');

                        let isCorrect = false;
                        if (selected) {
                            isCorrect = selected.dataset.correct === 'true';
                            answers[qid] = selected.value;
                            const parentLabel = selected.closest('.opt-label');
                            parentLabel.classList.add(isCorrect ? 'bg-green-50' : 'bg-red-50');
                            parentLabel.classList.add(isCorrect ? 'border-green-200' : 'border-red-200');
                        }
                        
                        if (isCorrect) correctCount++;
                        explanation.classList.remove('hidden');
                        qBlock.classList.add(isCorrect ? 'border-green-400' : 'border-red-400');
                        
                        // Feed the Spaced Repetition logic
                        stateManager.scheduleReview(qid, isCorrect);
                    });
                    
                    const total = questions.length;
                    // 80% passing rule
                    const required = Math.round(0.8 * total);
                    const passed = correctCount >= required;
                    
                    stateManager.data.quizzes[moduleId] = { score: correctCount, total, passed, answers };
                    stateManager.save();
                    
                    const resultSpan = form.querySelector('.quiz-result');
                    resultSpan.innerText = `Score: ${correctCount}/${total} — ${passed ? '✅ Passed!' : '❌ Needs Review'}`;
                    resultSpan.className = `quiz-result font-bold text-lg ${passed ? 'text-green-600' : 'text-red-600'}`;
                });
            });

            stateManager.checkModuleCompletion();
        }

        fetch('ux-studio-curriculum.md')
            .then(response => response.text())
            .then(text => {
                document.getElementById('app-content').innerHTML = marked.parse(text);
                transformInteractiveElements();
            })
            .catch(err => {
                document.getElementById('app-content').innerHTML = '<p class="text-red-500">Error loading curriculum file.</p>';
            });
    </script>
</body>
</html>
