<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UX Studio — Full UI/UX Design Course</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1b2340;--mute:#5d6682;--line:#d5dbe8;--ac:#5b4bff;--acT:#fff;--ok:#12805c;--okBg:#dcf5ea;--bad:#c2410c;--badBg:#ffe8d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142a;--card:#1a2040;--ink:#eef0fb;--mute:#a1a9c8;--line:#2b335c;--ac:#8c80ff;--acT:#10142a;--ok:#5fe0b0;--okBg:#12372c;--bad:#ffa66b;--badBg:#3d2412}}
:root[data-theme="dark"]{--bg:#10142a;--card:#1a2040;--ink:#eef0fb;--mute:#a1a9c8;--line:#2b335c;--ac:#8c80ff;--acT:#10142a;--ok:#5fe0b0;--okBg:#12372c;--bad:#ffa66b;--badBg:#3d2412}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.6 'Atkinson Hyperlegible',system-ui,sans-serif;min-height:100%}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.15;margin:0}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.ring{width:64px;height:64px;flex:none}
.top h1{font-size:28px;font-weight:800}.top p{margin:2px 0 0;color:var(--mute);font-size:15px}
.mod{display:flex;width:100%;align-items:center;gap:14px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.mod b{font-family:'Bricolage Grotesque';font-size:19px;display:block}
.mod small{color:var(--mute)}
.pie{width:44px;height:44px;flex:none}
.back{background:none;border:0;color:var(--ac);font-weight:700;padding:6px 0;margin-bottom:8px}
.lv{display:inline-block;font-size:14px;font-weight:700;color:var(--ac);border:1.5px solid var(--ac);border-radius:99px;padding:1px 10px;margin:8px 0}
h2{font-size:32px;font-weight:800}
.tabs{display:flex;gap:6px;margin:16px 0;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700}
.tabs button[aria-selected=true]{background:var(--ac);color:var(--acT)}
.tabs i{font-style:normal;color:var(--ok)}
.tabs button[aria-selected=true] i{color:var(--acT)}
p{margin:0 0 14px}.sec{font-size:21px;margin:24px 0 8px}
.key{background:var(--card);border-left:5px solid var(--ac);border-radius:8px;padding:12px 16px;margin:18px 0}
.key h3{font-size:18px;margin-bottom:6px}.key ul{margin:0;padding-left:20px}
.btn{display:block;width:100%;background:var(--ac);color:var(--acT);border:0;border-radius:12px;padding:14px;font-weight:700;font-size:17px;margin-top:16px}
.btn.done{background:var(--okBg);color:var(--ok)}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.q h3{font-size:19px;margin-bottom:10px}
.o{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.o.ok{background:var(--okBg);border-color:var(--ok)}.o.no{background:var(--badBg);border-color:var(--bad)}
.why{font-size:15px;color:var(--mute);margin:6px 0 0}
.score{text-align:center;font:800 26px 'Bricolage Grotesque';padding:12px}
.st{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.st .bx{width:26px;height:26px;border:2px solid var(--ac);border-radius:7px;flex:none;display:grid;place-items:center;font-weight:800;color:var(--acT)}
.st.on{background:var(--okBg);border-color:var(--ok)}.st.on .bx{background:var(--ok);border-color:var(--ok)}
.rs{background:none;border:0;color:var(--mute);text-decoration:underline;margin-top:24px;font-size:14px}
.inp{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.cert{border:4px double var(--ac);border-radius:12px;padding:28px 18px;text-align:center;background:var(--card)}.cert h1{font-size:34px;margin:8px 0}.cert small{color:var(--mute)}
.btn:disabled{opacity:.5}
@media print{.no-print,.back{display:none}body{background:#fff;color:#000}}
</style></head><body><main id="app"></main>
<script>fetch('curriculum.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(M=>{

const R={Beginner:0,Intermediate:1,Advanced:2,Expert:3},O=M.map((_,i)=>i).sort((a,b)=>R[M[a].lv]-R[M[b].lv]);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const g=id=>document.getElementById(id);
const TI=[{n:'Foundation',l:[0],c:20},{n:'Professional',l:[0,1,2],c:30},{n:'Expert',l:[0,1,2,3],c:40}];
const mods=t=>M.map((_,i)=>i).filter(i=>t.l.includes(R[M[i].lv]));
const ready=t=>mods(t).every(i=>parts(i)==3)&&(t.n=='Foundation'||labsDone()==LABS.length);
let E=null;
function certs(){
$.innerHTML=`<button class="back" id="bk">‹ All modules</button><h2>Certification</h2><p>To earn a certificate, finish every module in the tier (lesson, quiz at 80% or higher, project with written evidence), then pass the final exam at 80%. Exams use randomized questions from every module in the tier.</p>`+TI.map((t,k)=>{const m=mods(t),d=m.filter(i=>parts(i)==3).length,x=S.x[k],r=ready(t);return `<div class="q"><h3>${t.n} Certificate</h3><p class="why">${d} / ${m.length} modules complete · ${labsDone()}/${LABS.length} labs${t.n=='Foundation'?' (optional)':' (required)'} · ${t.c}-question exam</p>${x?`<button class="btn" data-c="${k}">View certificate (${Math.round(x.s/x.N*100)}%)</button>`:`<button class="btn" data-e="${k}" ${r?'':'disabled'}>${r?'Start final exam':'Finish modules and labs first'}</button>`}</div>`}).join('');
g('bk').onclick=home;
$.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>cert(+b.dataset.c));
$.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>startExam(+b.dataset.e))}
function startExam(k){const t=TI[k];let pool=[];mods(t).forEach(i=>M[i].q.forEach(q=>pool.push([q,i])));
pool.sort(()=>Math.random()-.5);pool=pool.slice(0,t.c);
E={k,n:0,r:[],qs:pool.map(([q,i])=>{const o=q[1].map((x,j)=>[x,j]).sort(()=>Math.random()-.5);return{q:q[0],o,a:o.findIndex(z=>z[1]==q[2]),m:i}})};scrollTo(0,0);examQ()}
function examQ(){const q=E.qs[E.n];
$.innerHTML=`<p class="why">${TI[E.k].n} exam · question ${E.n+1} of ${E.qs.length}</p><div class="q"><h3>${q.q}</h3>${q.o.map((o,j)=>`<button class="o" data-j="${j}">${o[0]}</button>`).join('')}</div>`;
$.querySelectorAll('.o').forEach(b=>b.onclick=()=>{E.r.push(+b.dataset.j);E.n++;E.n<E.qs.length?examQ():examEnd()})}
function examEnd(){const s=E.qs.filter((q,i)=>E.r[i]==q.a).length,N=E.qs.length,pass=s/N>=.8,k=E.k;
const miss=[...new Set(E.qs.filter((q,i)=>E.r[i]!=q.a).map(q=>M[q.m].t))];
if(pass){S.x[k]={s,N,d:new Date().toISOString().slice(0,10),id:Math.random().toString(36).slice(2,10).toUpperCase()};save()}
$.innerHTML=`<h2>${s} / ${N}</h2><div class="score">${pass?'Passed':'Not yet. 80% needed'}</div>${miss.length?`<p>Review these modules, then retake:</p><ul>${miss.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}<button class="btn" id="nx">${pass?'View certificate':'Back to certification'}</button>`;
g('nx').onclick=()=>pass?cert(k):certs()}
function cert(k){const t=TI[k],x=S.x[k];
if(!S.n){$.innerHTML=`<button class="back" id="bk">‹ Back</button><h2>Your name</h2><p>Enter the name to print on your certificate.</p><input id="nm" class="inp" maxlength="60" placeholder="Full name"><button class="btn" id="sv">Create certificate</button>`;
g('bk').onclick=certs;g('sv').onclick=()=>{const v=g('nm').value.trim();if(v.length<2)return;S.n=v;save();cert(k)};return}
$.innerHTML=`<button class="back no-print" id="bk">‹ Back</button><div class="cert"><p>UX Studio</p><h2>Certificate of Completion</h2><p>This certifies that</p><h1>${esc(S.n)}</h1><p>completed the <b>${t.n}</b> level of the UX Studio UI/UX design program: ${mods(t).length} modules with quizzes passed at 80% or higher and projects documented with evidence, plus a ${x.N}-question final exam (${Math.round(x.s/x.N*100)}%).</p><p>${x.d} · Certificate ID ${x.id}</p><small>Self-study program certificate. Not an accredited credential.</small></div><button class="btn no-print" id="pr">Print or save as PDF</button>`;
g('bk').onclick=certs;g('pr').onclick=()=>window.print()}
const LABS=[{id:'ct',t:'Contrast Lab',d:'Build a color pair that passes WCAG AA'},{id:'ty',t:'Type Scale Lab',d:'Design a readable modular type scale'},{id:'cs',t:'Card Sort Lab',d:'Organize content into groups users understand'},{id:'wf',t:'Wireframe Builder',d:'Assemble a mobile screen and pass the checks'},{id:'he',t:'Heuristic Review',d:'Diagnose 5 usability problems'}];
const labsDone=()=>LABS.filter(l=>S.b[l.id]).length;
const fin=id=>{S.b[id]=1;save()};
const OK=t=>`<div class="score" style="color:var(--ok)">${t||'Lab complete ✓'}</div>`;
function labs(){$.innerHTML=`<button class="back" id="bk">‹ All modules</button><h2>Hands-on Labs</h2><p>Build and test real skills. ${labsDone()} of ${LABS.length} complete. All five are required for the Professional and Expert certificates.</p>`+LABS.map((l,i)=>`<button class="mod" data-l="${i}"><span><b>${l.t}</b><small>${S.b[l.id]?'✓ Complete · ':''}${l.d}</small></span></button>`).join('');
g('bk').onclick=home;$.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>lab(+b.dataset.l))}
function lab(i){$.innerHTML=`<button class="back" id="bk">‹ All labs</button><h2>${LABS[i].t}</h2><div id="lb"></div>`;g('bk').onclick=labs;L[LABS[i].id](g('lb'))}
const lum=h=>{const c=[1,3,5].map(i=>{const v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const L={};
L.ct=el=>{el.innerHTML=`<p>Pick text and background colors. Goal: reach at least 4.5:1, and do not use plain black on white.</p><p><label>Text <input type="color" id="c1" value="#999999"></label> &nbsp; <label>Background <input type="color" id="c2" value="#ffffff"></label></p><div id="pv" class="q"><h3>Sample heading</h3><p>Body text sample for readability.</p></div><div id="rs"></div>`;
const up=()=>{const a=g('c1').value,b=g('c2').value,r=cr(a,b);g('pv').style.color=a;g('pv').style.background=b;
const P=(n,t)=>`${n}: ${r>=t?'Pass':'Fail'}`;
g('rs').innerHTML=`<div class="score">${r.toFixed(2)} : 1</div><p>${P('Normal text AA (4.5)',4.5)}<br>${P('Large text AA (3)',3)}<br>${P('UI components (3)',3)}<br>${P('AAA text (7)',7)}</p>`;
if(r>=4.5&&!(a=='#000000'&&b=='#ffffff')){fin('ct');g('rs').innerHTML+=OK()}};
g('c1').oninput=g('c2').oninput=up;up()};
L.ty=el=>{el.innerHTML=`<p>Set a base size and ratio, then save a readable scale (base 16px or larger).</p><p><label>Base <input type="number" id="bs" class="inp" value="14" min="10" max="24"></label><select id="rt" class="inp"><option>1.125</option><option>1.2</option><option selected>1.25</option><option>1.333</option><option>1.5</option></select></p><div id="pr"></div><button class="btn" id="sv">Save this scale</button><div id="ms"></div>`;
const up=()=>{const b=+g('bs').value,r=+g('rt').value;g('pr').innerHTML=[3,2,1,0,-1].map(n=>{const s=(b*Math.pow(r,n)).toFixed(1);return `<div style="font:700 ${s}px 'Bricolage Grotesque';line-height:1.2;margin:6px 0">${n>0?'Heading '+n:n==0?'Body text':'Caption'} · ${s}px</div>`}).join('')};
g('bs').oninput=g('rt').onchange=up;up();
g('sv').onclick=()=>{g('ms').innerHTML=+g('bs').value>=16?(fin('ty'),OK()):'<p class="why">Body text under 16px is hard to read on phones. Raise the base.</p>'}};
L.cs=el=>{const it=['Pricing','Contact us','Sign in','Blog','Help center','Careers','Refund policy','About us','Tutorials'],a={},nm={};
const draw=()=>{el.innerHTML=`<p>Tap each item to cycle it through Group 1, 2, and 3. Then name each group. Every group needs at least 2 items.</p>`+it.map((x,i)=>`<button class="o" data-i="${i}">${x}<b style="float:right">${a[i]?'Group '+a[i]:'unsorted'}</b></button>`).join('')+[1,2,3].map(n=>`<input class="inp" data-n="${n}" placeholder="Name for Group ${n}" value="${esc(nm[n]||'')}">`).join('')+`<button class="btn" id="ck">Check my sort</button><div id="ms"></div>`;
el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;a[i]=((a[i]||0)%3)+1;draw()});
el.querySelectorAll('[data-n]').forEach(b=>b.oninput=()=>nm[b.dataset.n]=b.value);
g('ck').onclick=()=>{const c=[1,2,3].map(n=>it.filter((x,i)=>a[i]==n).length),ok=it.every((x,i)=>a[i])&&c.every(x=>x>=2)&&[1,2,3].every(n=>(nm[n]||'').trim().length>=2);
g('ms').innerHTML=ok?(fin('cs'),OK()):'<p class="why">Sort every item, give each group 2 or more items, and name all 3 groups.</p>'}};draw()};
L.wf=el=>{const P={'Header':'Header','Hero':'Hero headline','Card':'Content card','Input':'Input field','Primary button':'Primary button','Nav':'Bottom navigation','Footer':'Footer'},st=[];
const draw=()=>{el.innerHTML=`<p>Add parts and reorder them. Goal: header first, a hero, 2 or more content cards, exactly one primary button, and navigation or footer last.</p><div>`+Object.keys(P).map(k=>`<button class="o" style="display:inline-block;width:auto;margin-right:6px" data-a="${k}">+ ${P[k]}</button>`).join('')+`</div><div class="q" style="margin-top:10px">`+(st.length?st.map((x,i)=>`<div class="st" style="padding:8px;margin-bottom:6px"><span style="flex:1">${P[x]}</span><button data-u="${i}">↑</button> <button data-d="${i}">↓</button> <button data-x="${i}">✕</button></div>`).join(''):'<p class="why">Empty screen. Add a part.</p>')+`</div><button class="btn" id="ck">Check my wireframe</button><div id="ms"></div>`;
el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{st.push(b.dataset.a);draw()});
el.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(i>0){[st[i-1],st[i]]=[st[i],st[i-1]];draw()}});
el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;if(i<st.length-1){[st[i+1],st[i]]=[st[i],st[i+1]];draw()}});
el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{st.splice(+b.dataset.x,1);draw()});
g('ck').onclick=()=>{const l=st[st.length-1],c=[['Header is first',st[0]=='Header'],['Has a hero',st.includes('Hero')],['2 or more content cards',st.filter(x=>x=='Card').length>=2],['Exactly one primary button',st.filter(x=>x=='Primary button').length==1],['Navigation or footer is last',l=='Nav'||l=='Footer']];
g('ms').innerHTML='<p>'+c.map(x=>(x[1]?'✓ ':'✗ ')+x[0]).join('<br>')+'</p>'+(c.every(x=>x[1])?(fin('wf'),OK()):'')}};draw()};
L.he=el=>{const H=['Visibility of system status','Error prevention','Consistency and standards','Recognition over recall','Help users recover from errors'],F=[['After tapping Pay, nothing changes for 8 seconds.',0],['Delete account sits beside Save with no confirmation.',1],['One screen says Log in, another Sign on, another Enter.',2],['Users must remember a code shown two screens earlier.',3],['An error reads only: Failure 0x4F.',4]];
el.innerHTML=`<p>Match each problem to the heuristic it violates. You need 4 of 5.</p>`+F.map((f,i)=>`<div class="q"><h3>${f[0]}</h3><select class="inp" data-q="${i}"><option value="">Choose…</option>${H.map((h,j)=>`<option value="${j}">${h}</option>`).join('')}</select></div>`).join('')+`<button class="btn" id="ck">Check my review</button><div id="ms"></div>`;
g('ck').onclick=()=>{let s=0;el.querySelectorAll('select').forEach(x=>{if(x.value!==''&&+x.value==F[+x.dataset.q][1])s++});
g('ms').innerHTML=`<div class="score">${s} / 5</div>`+(s>=4?(fin('he'),OK()):'<p class="why">Review the heuristics lessons and try again.</p>')}};
LABS.push({id:'sp',t:'Spacing Lab',d:'Apply the 8px grid and proximity'},{id:'pt',t:'Prototype State Lab',d:'Wire up a button state machine'},{id:'ax',t:'Accessibility Audit',d:'Find the real accessibility failures'});
L.sp=el=>{el.innerHTML=`<p>Tune spacing. Rules: every value is a multiple of 8, space between groups is larger than space inside a group, and padding is 16px or more.</p>`+[['pd','Card padding',16],['ig','Space inside group',4],['gg','Space between groups',12]].map(x=>`<p><label>${x[1]}: <b id="v${x[0]}">${x[2]}</b>px<input type="range" min="4" max="64" step="4" id="${x[0]}" value="${x[2]}" style="width:100%"></label></p>`).join('')+`<div id="cd" class="q"><div id="a1"><h3>Plan</h3><p>Pro, 10 seats</p></div><div id="a2"><h3>Billing</h3><p>Renews monthly</p></div></div><button class="btn" id="ck">Check spacing</button><div id="ms"></div>`;
const up=()=>{const p=+g('pd').value,i=+g('ig').value,w=+g('gg').value;['pd','ig','gg'].forEach(k=>g('v'+k).textContent=g(k).value);g('cd').style.padding=p+'px';el.querySelectorAll('#cd h3,#cd p').forEach(n=>n.style.margin='0 0 '+i+'px');g('a2').style.marginTop=w+'px'};
['pd','ig','gg'].forEach(k=>g(k).oninput=up);up();
g('ck').onclick=()=>{const p=+g('pd').value,i=+g('ig').value,w=+g('gg').value,c=[['All values multiples of 8',[p,i,w].every(v=>v%8==0)],['Group gap larger than inner gap',w>i],['Padding at least 16px',p>=16]];
g('ms').innerHTML='<p>'+c.map(x=>(x[1]?'✓ ':'✗ ')+x[0]).join('<br>')+'</p>'+(c.every(x=>x[1])?(fin('sp'),OK()):'')}};
L.pt=el=>{const S4=['Default','Loading','Success','Error'],E=[['Tap Submit from Default',1],['Request succeeds',2],['Request fails',3],['Tap Retry from Error',1],['Success message times out',0]];
el.innerHTML=`<p>Choose the next state for each event of a submit button. Then test it.</p>`+E.map((e,i)=>`<div class="q"><h3>${e[0]}</h3><select class="inp" data-q="${i}"><option value="">Next state…</option>${S4.map((s,j)=>`<option value="${j}">${s}</option>`).join('')}</select></div>`).join('')+`<button class="btn" id="ck">Check state machine</button><div id="ms"></div><div id="dm"></div>`;
g('ck').onclick=()=>{let ok=0;el.querySelectorAll('select').forEach(x=>{if(x.value!==''&&+x.value==E[+x.dataset.q][1])ok++});
if(ok<5){g('ms').innerHTML=`<div class="score">${ok} / 5 correct</div><p class="why">Think: what must the user see while waiting, after success, and after a failure?</p>`;return}
fin('pt');let s=0;g('ms').innerHTML=OK();g('dm').innerHTML='<p>Try your button. Click it to cycle through the states.</p><button class="btn" id="bt">Submit</button>';
g('bt').onclick=()=>{s=(s+1)%4;g('bt').textContent=['Submit','Sending…','Sent ✓','Retry'][s]}}};
L.ax=el=>{const I=[['The placeholder is the only label on an input.',1],['A 44px-tall button is labeled Submit.',0],['Errors appear only as red text.',1],['An informative image has alt text describing its purpose.',0],['Focus outlines were removed with no replacement.',1],['Body text has a 5.1:1 contrast ratio.',0]];
el.innerHTML=`<p>Select only the items that are accessibility failures.</p>`+I.map((x,i)=>`<button class="st" role="checkbox" aria-checked="false" data-i="${i}"><span class="bx"></span><span>${x[0]}</span></button>`).join('')+`<button class="btn" id="ck">Check my audit</button><div id="ms"></div>`;
const sel={};el.querySelectorAll('.st').forEach(b=>b.onclick=()=>{const i=b.dataset.i;sel[i]=!sel[i];b.classList.toggle('on',sel[i]);b.querySelector('.bx').textContent=sel[i]?'✓':'';b.setAttribute('aria-checked',!!sel[i])});
g('ck').onclick=()=>{const ok=I.every((x,i)=>!!sel[i]==!!x[1]);g('ms').innerHTML=ok?OK():'<p class="why">Not quite. Missing a failure or flagging something that already passes. Review WCAG: labels, color-only meaning, focus visibility, contrast.</p>';if(ok)fin('ax')}};
LABS.push({id:'tt',t:'Tree Test Lab',d:'Find items in a hierarchy'},{id:'tk',t:'Design Token Builder',d:'Create a purposeful token set'},{id:'tm',t:'Motion Timing Lab',d:'Tune durations for real interactions'});
